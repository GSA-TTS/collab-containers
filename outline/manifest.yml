---
applications:
- name: outline-app
  memory: 2G
  disk_quota: 2G
  instances: 1
  docker:
    image: outlinewiki/outline:latest
  routes:
  - route: outline.app.cloud.gov
  env:
    # Basic configuration
    DATABASE_URL: postgres://outline_user:outline_password@db-host:5432/outline
    REDIS_URL: redis://redis-host:6379
    SECRET_KEY: your-secret-key
    UTILS_SECRET: your-utils-secret
    URL: https://outline.app.cloud.gov
    PORT: 3000
    FORCE_HTTPS: "true"
    ENABLE_UPDATES: "false"
    SLACK_KEY: your-slack-key
    SLACK_SECRET: your-slack-secret
    AWS_ACCESS_KEY_ID: your-aws-access-key
    AWS_SECRET_ACCESS_KEY: your-aws-secret-key
    AWS_REGION: us-east-1
    AWS_S3_UPLOAD_BUCKET_URL: https://your-s3-bucket.s3.amazonaws.com
    AWS_S3_UPLOAD_BUCKET_NAME: your-s3-bucket
    AWS_S3_UPLOAD_MAX_SIZE: 26214400
  volume_mounts:
  - path: /data
    volume: outline-data
