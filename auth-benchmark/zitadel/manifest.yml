---
applications:
  # ==========================================================================
  # Zitadel API Service (Core Identity Platform)
  # ==========================================================================
  - name: zitadel-api-staging
    memory: 512M
    disk_quota: 1G
    instances: 1

    # Archived experiment: Docker-based Zitadel on cloud.gov is currently unsupported here.
    docker:
      image: johnjediny/zitadel-cf:v4.15.0-cf6

    # Public route for OIDC endpoints + internal route for Login UI
    routes:
      - route: ((public_host))
      - route: ((internal_api_host))

    services:
      - ((db_service_name))

    env:
      # Domain configuration
      ZITADEL_EXTERNALDOMAIN: ((external_domain))
      ZITADEL_EXTERNALPORT: "443"
      ZITADEL_EXTERNALSECURE: "true"
      
      # Disable TLS (terminated at Gorouter)
      ZITADEL_TLS_ENABLED: "false"
      ZITADEL_PORT: "8080"
      
      # Security - MUST be exactly 32 characters
      ZITADEL_MASTERKEY: ((masterkey))
      
      # Database connection - hardcoded for distroless image
      ZITADEL_DATABASE_POSTGRES_HOST: ((postgres_host))
      ZITADEL_DATABASE_POSTGRES_PORT: "5432"
      ZITADEL_DATABASE_POSTGRES_DATABASE: ((postgres_db))
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: ((postgres_user))
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: ((postgres_password))
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: require
      
      # First instance bootstrap
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "false"
      
      # Logging
      ZITADEL_LOGSTORE_ACCESS_STDOUT_ENABLED: "true"

    # Historical command from the blocked Docker experiment, retained for reproducibility only.
    command: /bin/sh -c 'exec /start.sh start-from-init --masterkeyFromEnv'

  # ==========================================================================
  # Zitadel Login UI Service (Next.js Frontend)
  # ==========================================================================
  - name: zitadel-login-staging
    memory: 256M
    disk_quota: 512M
    instances: 1

    docker:
      image: ghcr.io/zitadel/zitadel-login:v4.15.0

    routes:
      - route: ((public_host))/ui/v2/login

    env:
      # API connection (internal container-to-container)
      ZITADEL_API_URL: http://((internal_api_host)):8080
      
      # Base path for Next.js
      NEXT_PUBLIC_BASE_PATH: /ui/v2/login
      
      # Custom headers to pass to API
      CUSTOM_REQUEST_HEADERS: "Host:((external_domain)),X-Forwarded-Proto:https"

    command: node /app/server.js
