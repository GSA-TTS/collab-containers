---
# Zitadel Deployment Variables for cloud.gov
# Usage: cf push --vars-file vars.yml

# =============================================================================
# Route Configuration
# =============================================================================
public_host: example-public-host.app.cloud.gov
internal_api_host: example-internal-api-host.apps.internal
external_domain: example-app.app.cloud.gov

# =============================================================================
# Database Service
# =============================================================================
db_service_name: zitadel-db

# Database credentials (from cf service-key zitadel-db zitadel-key)
# Replace these placeholders locally before any manual cf push.
postgres_host: example-postgres-host.app.cloud.gov
postgres_db: REPLACE_WITH_RDS_DB
postgres_user: REPLACE_WITH_RDS_USER
postgres_password: REPLACE_WITH_SECURE_RANDOM_VALUE

# =============================================================================
# Security
# =============================================================================
# Must be exactly 32 characters. Generate with: openssl rand -hex 16
masterkey: REPLACE_WITH_SECURE_RANDOM_VALUE
