# CI/CD HELPERS
# ============================================================================

"ci:pre-release-check" = """
#!/bin/bash
set -euo pipefail
echo "========================================="
echo "   PRE-RELEASE CHECKS"
echo "========================================="
echo ""

echo "✓ Running security scans..."
mise run scan:all
echo ""

echo "✓ Running linters..."
