---
applications:
- name: video-conference-app
  memory: 2G
  disk_quota: 2G
  instances: 1
  docker:
    image: jitsi/web:stable-8960-1
  routes:
  - route: video-conference.app.cloud.gov
  env:
    # Basic configuration
    PUBLIC_URL: https://video-conference.app.cloud.gov
    ENABLE_WELCOME_PAGE: true
    ENABLE_PREJOIN_PAGE: true
    
    # Simplified config for single container
    ENABLE_P2P: true
    P2P_PREFERRED_CODEC: VP9
    
    # Use public STUN servers
    STUN_SERVERS: stun:stun.l.google.com:19302,stun:stun1.l.google.com:19302
    
    # Disable components that need separate containers
    ENABLE_RECORDING: false
    ENABLE_LIVESTREAMING: false
    
    # Security settings
    ENABLE_LOBBY: true
    ENABLE_PASSWORD: true
    
  services:
  - video-conference-db  # If you need persistent storage