---
applications:
  - name: openvscode
    docker:
      image: gitpod/openvscode-server:1.105.1
    memory: 3G
    disk_quota: 2G
    command: |
      /home/.openvscode-server/bin/openvscode-server \
        --host 0.0.0.0 \
        --port 3000 \
        --without-connection-token \
        --user-data-dir /tmp/.vscode
    volume_mounts:
      - path: /
        volume: codebase
