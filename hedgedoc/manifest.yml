applications:
  - name: hedgedoc
    memory: 512M
    disk_quota: 1G
    instances: 1
    docker:
      image: quay.io/hedgedoc/hedgedoc:latest
    env:
      CMD_ALLOW_ORIGIN: '*'
      CMD_DB_DIALECT: 'postgres'
      CMD_LOGLEVEL: 'debug'
    volume_mounts:
      - path: /data
        volume: hedgedoc-data
    services:
      - hedgedoc-db
    command: |
       export CMD_DB_URL=$DATABASE_URL && \
       echo $dbURL && \
       node -e "console.log('dbURL:', process.env.dbURL)" && \
       node app.js
