applications:
  - name: hedgedoc
    memory: 512M
    disk_quota: 1G
    instances: 1
    docker:
      image: gsatts/hedgedoc-custom:latest
    env:
      CMD_DB_URL: sqlite:///data/hedgedoc.sqlite
      CMD_ALLOW_ORIGIN: '*'
    volume_mounts:
      - path: /data
        volume: hedgedoc-data
    command: "/bin/bash /app/init.sh node app.js"
