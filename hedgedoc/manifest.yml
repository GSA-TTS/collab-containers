---
applications:
  - name: hedgedoc
    memory: 512M
    disk_quota: 1G
    instances: 1
    docker:
      image: quay.io/hedgedoc/hedgedoc:1.10.8
    routes:
      - route: hedgedoc.app.cloud.gov
    env:
      CMD_ALLOW_ORIGIN: "*"
      CMD_ALLOW_ANONYMOUS: "false"
      CMD_DB_DIALECT: "postgres"
      CMD_DOMAIN: "hedgedoc.app.cloud.gov"
      CMD_EMAIL: "false"
      CMD_LOGLEVEL: "debug"
      CMD_OAUTH2_AUTHORIZATION_URL: "https://login.fr.cloud.gov/oauth/authorize"
      CMD_OAUTH2_PROVIDERNAME: "cloud.gov"
      CMD_OAUTH2_SCOPE: "openid"
      CMD_OAUTH2_TOKEN_URL: "https://uaa.fr.cloud.gov/oauth/token"
      CMD_OAUTH2_USER_PROFILE_DISPLAY_NAME_ATTR: "user_name"
      CMD_OAUTH2_USER_PROFILE_EMAIL_ATTR: "email"
      CMD_OAUTH2_USER_PROFILE_ID_ATTR: "user_id"
      CMD_OAUTH2_USER_PROFILE_URL: "https://uaa.fr.cloud.gov/userinfo"
      CMD_OAUTH2_USER_PROFILE_USERNAME_ATTR: "user_name"
      CMD_PORT: "3000"
      CMD_PROTOCOL_USESSL: "true"
      CMD_REQUIRE_FREEURL_AUTHENTICATION: "true"
      CMD_URL_ADDPORT: "false"
      HD_PLANTUML_SERVER: "https://www.plantuml.com/plantuml"
      PGSSLMODE: "no-verify"
    services:
      - hedgedoc-db
    command: |
      export NODE_ENV=production
      export CMD_CONFIG_FILE=/tmp/hedgedoc-config.json
      if [ -z "$DATABASE_URL" ] && [ -n "$VCAP_SERVICES" ]; then
        DATABASE_URL=$(
          node <<'NODE'
      const services = JSON.parse(process.env.VCAP_SERVICES || "{}");
      const creds = ((services["aws-rds"] || [])[0] || {}).credentials || {};
      process.stdout.write(creds.uri || "");
      NODE
        )
        export DATABASE_URL
      fi
      if [ -z "$DATABASE_URL" ]; then
        echo "DATABASE_URL is not set. Bind an aws-rds service before starting HedgeDoc."
        exit 1
      fi
      if [ -z "${CMD_SESSION_SECRET:-}" ]; then
        CMD_SESSION_SECRET=$(node -e 'console.log(require("crypto").randomBytes(32).toString("base64"))')
      fi
      export CMD_SESSION_SECRET
      node -e '
        const config = {
          production: {
            dbURL: process.env.DATABASE_URL,
            dialectOptions: {
              ssl: {
                require: true,
                rejectUnauthorized: false
              }
            }
          }
        };
        require("fs").writeFileSync(process.env.CMD_CONFIG_FILE, JSON.stringify(config));
      '
      export CMD_PORT="${PORT:-3000}"
      echo "Starting HedgeDoc with bound Postgres service and cloud.gov route ${CMD_DOMAIN}."
      exec node app.js
