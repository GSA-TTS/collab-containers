---
applications:
  # ==========================================================================
  # Backstage Backend Application (Internal Route Only)
  # ==========================================================================
  # This app is NOT directly accessible from the internet.
  # Traffic flows through oauth2-proxy which handles authentication.
  - name: ((app_name))
    memory: 1G
    disk_quota: 2G
    instances: 1

    # Use official Backstage image
    docker:
      image: ghcr.io/backstage/backstage:1.51.0

    # Internal route only - oauth2-proxy forwards traffic here
    routes:
      - route: ((internal_host))

    # Bind the PostgreSQL database service
    services:
      - ((db_service_name))

    env:
      NODE_ENV: production
      PROTECTED_HOST: ((protected_host))

    command: |
      set -eu

      parse_rds_credential() {
        node -e '
          const services = JSON.parse(process.env.VCAP_SERVICES || "{}");
          const creds = ((services["aws-rds"] || [])[0] || {}).credentials || {};
          const key = process.argv[1];
          process.stdout.write(String(creds[key] || ""));
        ' "$1"
      }

      POSTGRES_HOST=$(parse_rds_credential host)
      POSTGRES_PORT=$(parse_rds_credential port)
      POSTGRES_USER=$(parse_rds_credential username)
      POSTGRES_PASSWORD=$(parse_rds_credential password)
      POSTGRES_DB=$(parse_rds_credential db_name)
      POSTGRES_PORT="${POSTGRES_PORT:-5432}"
      export POSTGRES_HOST POSTGRES_PORT POSTGRES_USER POSTGRES_PASSWORD POSTGRES_DB

      cat > /tmp/app-config.cloudgov.yaml <<EOF
      app:
        baseUrl: https://${PROTECTED_HOST}
      backend:
        baseUrl: https://${PROTECTED_HOST}
        listen:
          port: ${PORT:-7007}
        database:
          client: pg
          connection:
            host: ${POSTGRES_HOST}
            port: ${POSTGRES_PORT}
            user: ${POSTGRES_USER}
            password: ${POSTGRES_PASSWORD}
            database: ${POSTGRES_DB}
            ssl:
              rejectUnauthorized: false
      auth:
        environment: production
        providers:
          guest:
            dangerouslyAllowOutsideDevelopment: true
      EOF

      cat /tmp/app-config.cloudgov.yaml
      exec node packages/backend \
        --config app-config.yaml \
        --config /tmp/app-config.cloudgov.yaml

  # ==========================================================================
  # OAuth2-Proxy (Public Gateway)
  # ==========================================================================
  # Handles Cloud.gov UAA authentication and forwards to Backstage
  - name: ((proxy_name))
    memory: 256M
    disk_quota: 512M
    instances: 1
    docker:
      image: ((proxy_container_image))
    routes:
      - route: ((protected_host))
    env:
      UAA_SERVICE_NAME: ((uaa_service_name))
      UPSTREAM_URL: ((upstream_url))
      PROTECTED_HOST: ((protected_host))
      OAUTH2_PROXY_COOKIE_SECRET: ((cookie_secret))
      COOKIE_DOMAIN: ((cookie_domain))
      WHITELIST_DOMAIN: ((whitelist_domain))
      UAA_SCOPE: ((uaa_scope))
    services:
      - name: ((uaa_service_name))
        parameters:
          redirect_uri:
            - https://((protected_host))/oauth2/callback
    command: |
      set -eu
      export PORT="${PORT:-4180}"

      # Parse credentials from VCAP_SERVICES using robust busybox grep/cut
      CLIENT_ID=$(echo "$VCAP_SERVICES" | grep -oE '"client_id": *"[^"]+"' | head -n1 | cut -d'"' -f4)
      CLIENT_SECRET=$(echo "$VCAP_SERVICES" | grep -oE '"client_secret": *"[^"]+"' | head -n1 | cut -d'"' -f4)

      if [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ]; then
        echo "Error: Failed to parse UAA credentials from VCAP_SERVICES" >&2
        exit 1
      fi

      export OAUTH2_PROXY_PROVIDER="oidc"
      export OAUTH2_PROXY_CLIENT_ID="$CLIENT_ID"
      export OAUTH2_PROXY_CLIENT_SECRET="$CLIENT_SECRET"
      export OAUTH2_PROXY_OIDC_ISSUER_URL="https://login.fr.cloud.gov/oauth/token"
      export OAUTH2_PROXY_INSECURE_OIDC_SKIP_ISSUER_VERIFICATION="true"
      export OAUTH2_PROXY_INSECURE_OIDC_ALLOW_UNVERIFIED_EMAIL="true"
      export OAUTH2_PROXY_HTTP_ADDRESS="0.0.0.0:${PORT}"
      export OAUTH2_PROXY_REDIRECT_URL="https://${PROTECTED_HOST}/oauth2/callback"
      export OAUTH2_PROXY_UPSTREAMS="${UPSTREAM_URL}"
      export OAUTH2_PROXY_COOKIE_DOMAINS="${COOKIE_DOMAIN}"
      export OAUTH2_PROXY_WHITELIST_DOMAINS="${WHITELIST_DOMAIN}"
      export OAUTH2_PROXY_EMAIL_DOMAINS="*"
      export OAUTH2_PROXY_COOKIE_SECURE="true"
      export OAUTH2_PROXY_COOKIE_SAMESITE="lax"
      export OAUTH2_PROXY_PASS_HOST_HEADER="true"
      export OAUTH2_PROXY_REVERSE_PROXY="true"
      export OAUTH2_PROXY_SKIP_PROVIDER_BUTTON="true"
      export OAUTH2_PROXY_SCOPE="${UAA_SCOPE}"
      # Pass user headers to Backstage for identity
      export OAUTH2_PROXY_PASS_USER_HEADERS="true"
      export OAUTH2_PROXY_SET_XAUTHREQUEST="true"

      exec oauth2-proxy
