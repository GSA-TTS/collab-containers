---
applications:
  - name: planka-app
    memory: 512M
    disk_quota: 1G
    instances: 1
    docker:
      image: ghcr.io/plankanban/planka:latest
    routes:
      - route: planka.app.cloud.gov
    env:
      # Basic configuration
      BASE_URL: https://planka.app.cloud.gov
      OIDC_ISSUER: https://uaa.fr.cloud.gov/oauth/token
      OIDC_USERNAME_ATTRIBUTE: user_name
      OIDC_NAME_ATTRIBUTE: user_name
    services:
      - planka-db
    volume_mounts:
      - path: /app/data
        volume: planka-data
    command: |
      if [ -z "$DATABASE_URL" ] && [ -n "$VCAP_SERVICES" ]; then
        export DATABASE_URL=$(node -e 'const services = JSON.parse(process.env.VCAP_SERVICES || "{}"); const creds = ((services["aws-rds"] || services["postgres"] || [])[0] || {}).credentials || {}; process.stdout.write(creds.uri || "");')
      fi
      if [ -z "$DATABASE_URL" ]; then
        echo "DATABASE_URL is not set. Bind an aws-rds service before starting Planka."
        exit 1
      fi
      export PGSSLMODE=no-verify
      export KNEX_REJECT_UNAUTHORIZED_SSL_CERTIFICATE=false
      if [ -z "$OIDC_CLIENT_ID" ] && [ -n "$VCAP_SERVICES" ]; then
        export OIDC_CLIENT_ID=$(node -e 'const services = JSON.parse(process.env.VCAP_SERVICES || "{}"); const creds = ((services["cloud-gov-identity-provider"] || []).find(s => s.name === "planka-uaa") || {}).credentials || {}; process.stdout.write(creds.client_id || "");')
      fi
      if [ -z "$OIDC_CLIENT_SECRET" ] && [ -n "$VCAP_SERVICES" ]; then
        export OIDC_CLIENT_SECRET=$(node -e 'const services = JSON.parse(process.env.VCAP_SERVICES || "{}"); const creds = ((services["cloud-gov-identity-provider"] || []).find(s => s.name === "planka-uaa") || {}).credentials || {}; process.stdout.write(creds.client_secret || "");')
      fi
      export SECRET_KEY="${SECRET_KEY:-$(node -e 'console.log(require("crypto").randomBytes(32).toString("hex"))')}"
      echo "Running Planka database migrations..."
      node /app/node_modules/knex/bin/cli.js migrate:latest --cwd /app/db
      node /app/db/init.js
      echo "Starting Planka..."
      if [ -f /app/docker-entrypoint.sh ]; then
        exec /app/docker-entrypoint.sh node app.js
      elif [ -f /docker-entrypoint.sh ]; then
        exec /docker-entrypoint.sh node app.js
      else
        exec node app.js
      fi
