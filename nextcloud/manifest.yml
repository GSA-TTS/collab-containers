---
applications:
- name: nextcloud-app
  memory: 2G
  disk_quota: 2G
  instances: 1
  docker:
    image: nextcloud/all-in-one:latest
  routes:
  - route: nextcloud.app.cloud.gov
  env:
    # Basic configuration
    NEXTCLOUD_ADMIN_USER: admin
    NEXTCLOUD_ADMIN_PASSWORD: adminpassword
    NEXTCLOUD_TRUSTED_DOMAINS: nextcloud.app.cloud.gov
    NEXTCLOUD_OVERWRITEHOST: nextcloud.app.cloud.gov
    NEXTCLOUD_OVERWRITEPROTOCOL: https
    NEXTCLOUD_DATA_DIR: /var/www/html/data
  volume_mounts:
  - path: /var/www/html/data
    volume: nextcloud-data
