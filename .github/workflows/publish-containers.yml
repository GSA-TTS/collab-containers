---
# yamllint disable rule:line-length rule:truthy
name: Publish Containers

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Release version without a leading v
        required: true
        type: string
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Discover Docker build contexts
        id: discover
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob
          matrix_json='{"include":[]}'
          for dockerfile in */Dockerfile; do
            context_dir="${dockerfile%/Dockerfile}"
            image_name="$(printf '%s' "$context_dir" | tr '[:upper:]' '[:lower:]')"
            matrix_json="$(jq -c --arg context "$context_dir" --arg dockerfile "$dockerfile" --arg image "$image_name" \
              '.include += [{context: $context, dockerfile: $dockerfile, image: $image}]' <<< "$matrix_json")"
          done

          echo "matrix=$matrix_json" >> "$GITHUB_OUTPUT"

  publish:
    needs: discover
    if: ${{ fromJson(needs.discover.outputs.matrix).include[0] != null }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      actions: read  # Required by upload-sarif on private repositories
      security-events: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    env:
      REGISTRY: ghcr.io
      RELEASE_VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || format('v{0}', inputs.release_version) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Normalize image name
        env:
          MATRIX_IMAGE: ${{ matrix.image }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          echo "IMAGE_NAME=${REPOSITORY_OWNER,,}/${MATRIX_IMAGE}" >> "$GITHUB_ENV"

      - name: Free runner disk space
        # The Backstage build (Node + native deps) plus image scan exceeds the default runner disk.
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af >/dev/null 2>&1 || true
          df -h / | tail -1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.RELEASE_VERSION }}
            type=raw,value=latest

      - name: Build local image for security verification
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          tags: local/${{ matrix.image }}:release-${{ github.run_id }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: local/${{ matrix.image }}:release-${{ github.run_id }}
          format: 'sarif'
          output: trivy-results-${{ matrix.image }}.sarif
          severity: 'HIGH,CRITICAL'
          scanners: 'vuln,config,secret'

      - name: Generate SBOM (SPDX)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: local/${{ matrix.image }}:release-${{ github.run_id }}
          format: 'spdx-json'
          output: sbom-${{ matrix.image }}-spdx.json

      - name: Generate SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: local/${{ matrix.image }}:release-${{ github.run_id }}
          format: 'cyclonedx'
          output: sbom-${{ matrix.image }}-cyclonedx.json

      # Findings are recorded, not blocking: they are published to the job summary and the
      # stored artifact, and tracked in docs/IMAGE-VULNERABILITY-REGISTER.md.
      - name: Record Trivy findings (non-blocking)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: local/${{ matrix.image }}:release-${{ github.run_id }}
          format: 'table'
          output: trivy-findings-${{ matrix.image }}.txt
          severity: 'HIGH,CRITICAL'
          scanners: 'vuln,config,secret'
          exit-code: '0'

      - name: Publish findings summary
        if: always()
        env:
          IMAGE: ${{ matrix.image }}
        shell: bash
        run: |
          set -euo pipefail
          report="trivy-findings-${IMAGE}.txt"
          {
            echo "## Trivy findings: ${IMAGE} (HIGH/CRITICAL, non-blocking)"
            if [[ -f "$report" ]]; then
              grep -E '^Total:' "$report" || echo "No vulnerability totals reported."
              echo '```text'
              head -c 60000 "$report"
              echo '```'
            else
              echo "Trivy findings report was not produced."
            fi
            echo "Register: docs/IMAGE-VULNERABILITY-REGISTER.md"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Trivy SARIF report to GitHub Security tab
        uses: github/codeql-action/upload-sarif@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3
        if: always()
        # Needs GitHub Code Security (private repos) or a public repository. The
        # report is also kept as a workflow artifact.
        continue-on-error: true
        with:
          sarif_file: trivy-results-${{ matrix.image }}.sarif
          category: trivy-${{ matrix.image }}

      - name: Store scan and SBOM artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ${{ matrix.image }}-${{ env.RELEASE_VERSION }}-security-reports
          path: |
            trivy-results-${{ matrix.image }}.sarif
            trivy-findings-${{ matrix.image }}.txt
            sbom-${{ matrix.image }}-spdx.json
            sbom-${{ matrix.image }}-cyclonedx.json
          retention-days: 90

      - name: Push verified image
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          LOCAL_IMAGE: local/${{ matrix.image }}:release-${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            docker image tag "$LOCAL_IMAGE" "$tag"
            docker image push "$tag"
          done <<< "$IMAGE_TAGS"

      - name: Create container release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MATRIX_IMAGE: ${{ matrix.image }}
        shell: bash
        run: |
          set -euo pipefail

          tag="${MATRIX_IMAGE}-${RELEASE_VERSION}"
          title="${MATRIX_IMAGE} ${RELEASE_VERSION}"
          image_ref="${REGISTRY}/${IMAGE_NAME}:${RELEASE_VERSION}"
          notes=$(cat <<EOF
          Published container image for ${MATRIX_IMAGE}.

          ## Image Reference
          \`\`\`
          ${image_ref}
          \`\`\`

          ## Security Reports
          This release includes:
          - **Trivy** vulnerability scan (SARIF format)
          - **SBOM** (Software Bill of Materials) in SPDX and CycloneDX formats

          Findings are recorded, not blocking. Review the attached reports and docs/IMAGE-VULNERABILITY-REGISTER.md before deployment.

          ## Deployment Options

          ### Option 1: Deploy from Registry (Recommended)
          \`\`\`bash
          docker pull ${image_ref}
          docker run -d ${image_ref}
          \`\`\`

          ### Option 2: Build Locally
          \`\`\`bash
          git clone https://github.com/${GITHUB_REPOSITORY}.git
          cd ${MATRIX_IMAGE}
          docker build -t ${MATRIX_IMAGE}:${RELEASE_VERSION} .
          \`\`\`

          ## Verification
          All images are scanned with:
          - Trivy (vulnerability, configuration and secret scanning)

          Reports attached to this release.
          EOF
          )

          assets=("trivy-results-${MATRIX_IMAGE}.sarif#trivy-vulnerability-scan.sarif")
          assets+=("sbom-${MATRIX_IMAGE}-spdx.json#sbom-spdx.json")
          assets+=("sbom-${MATRIX_IMAGE}-cyclonedx.json#sbom-cyclonedx.json")

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" --clobber "${assets[@]}"
            gh release edit "$tag" --title "$title" --notes "$notes"
          else
            gh release create "$tag" --title "$title" --notes "$notes" "${assets[@]}"
          fi
