---
# yamllint disable rule:line-length rule:truthy
name: Publish Containers

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Release version without a leading v
        required: true
        type: string
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: Discover Docker build contexts
        id: discover
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob
          matrix_json='{"include":[]}'
          for dockerfile in */Dockerfile; do
            context_dir="${dockerfile%/Dockerfile}"
            image_name="$(printf '%s' "$context_dir" | tr '[:upper:]' '[:lower:]')"
            matrix_json="$(jq -c --arg context "$context_dir" --arg dockerfile "$dockerfile" --arg image "$image_name" \
              '.include += [{context: $context, dockerfile: $dockerfile, image: $image}]' <<< "$matrix_json")"
          done

          echo "matrix=$matrix_json" >> "$GITHUB_OUTPUT"

  publish:
    needs: discover
    if: ${{ fromJson(needs.discover.outputs.matrix).include[0] != null }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      actions: read  # Required by upload-sarif on private repositories
      security-events: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    env:
      REGISTRY: ghcr.io
      RELEASE_VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || format('v{0}', inputs.release_version) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: Normalize image name
        env:
          MATRIX_IMAGE: ${{ matrix.image }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          echo "IMAGE_NAME=${REPOSITORY_OWNER,,}/${MATRIX_IMAGE}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.RELEASE_VERSION }}
            type=raw,value=latest

      - name: Build local image for security verification
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          tags: local/${{ matrix.image }}:release-${{ github.run_id }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: local/${{ matrix.image }}:release-${{ github.run_id }}
          format: 'sarif'
          output: trivy-results-${{ matrix.image }}.sarif
          severity: 'HIGH,CRITICAL'
          scanners: 'vuln,config,secret'

      - name: Generate SBOM (SPDX)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: local/${{ matrix.image }}:release-${{ github.run_id }}
          format: 'spdx-json'
          output: sbom-${{ matrix.image }}-spdx.json

      - name: Generate SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: local/${{ matrix.image }}:release-${{ github.run_id }}
          format: 'cyclonedx'
          output: sbom-${{ matrix.image }}-cyclonedx.json

      - name: Upload Trivy SARIF report to GitHub Security tab
        uses: github/codeql-action/upload-sarif@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3
        if: always()
        # Needs GitHub Code Security (private repos) or a public repository. The
        # report is also kept as a workflow artifact, and the Trivy gate below still enforces.
        continue-on-error: true
        with:
          sarif_file: trivy-results-${{ matrix.image }}.sarif
          category: trivy-${{ matrix.image }}

      - name: Store scan and SBOM artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ${{ matrix.image }}-${{ env.RELEASE_VERSION }}-security-reports
          path: |
            trivy-results-${{ matrix.image }}.sarif
            sbom-${{ matrix.image }}-spdx.json
            sbom-${{ matrix.image }}-cyclonedx.json
          retention-days: 90

      - name: Run DockSec scan-only analysis
        env:
          DOCKSEC_RESULTS_DIR: ${{ runner.temp }}/docksec-results/${{ matrix.image }}
        uses: ./DockSec
        with:
          dockerfile: ${{ matrix.dockerfile }}
          image: local/${{ matrix.image }}:release-${{ github.run_id }}
          scan_only: "true"

      - name: Collect DockSec reports
        id: reports
        env:
          DOCKSEC_RESULTS_DIR: ${{ runner.temp }}/docksec-results/${{ matrix.image }}
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import pathlib

          output_path = pathlib.Path(os.environ["GITHUB_OUTPUT"])
          results_root = pathlib.Path(os.environ["DOCKSEC_RESULTS_DIR"])

          report_dirs = sorted(
              [path for path in results_root.iterdir() if path.is_dir()],
              key=lambda path: path.stat().st_mtime,
              reverse=True,
          ) if results_root.exists() else []

          if not report_dirs:
              raise SystemExit("DockSec did not produce a report directory")

          latest_dir = report_dirs[0]
          reports = {
              "json_report": next(latest_dir.glob("*.json"), None),
              "html_report": next(latest_dir.glob("*.html"), None),
              "csv_report": next(latest_dir.glob("*.csv"), None),
              "pdf_report": next(latest_dir.glob("*.pdf"), None),
          }

          if reports["json_report"] is None:
              raise SystemExit(f"DockSec JSON report not found in {latest_dir}")

          with output_path.open("a", encoding="utf-8") as fh:
              fh.write(f"results_dir={latest_dir}\n")
              for key, value in reports.items():
                  fh.write(f"{key}={value or ''}\n")
          PY

      - name: Upload scan artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.image }}-${{ env.RELEASE_VERSION }}-docksec
          path: |
            ${{ steps.reports.outputs.results_dir }}

      # Fail publication only after preserving the scan and DockSec evidence.
      - name: Enforce Trivy vulnerability threshold
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: local/${{ matrix.image }}:release-${{ github.run_id }}
          format: 'table'
          severity: 'HIGH,CRITICAL'
          scanners: 'vuln,config,secret'
          exit-code: '1'

      - name: Push verified image
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          LOCAL_IMAGE: local/${{ matrix.image }}:release-${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            docker image tag "$LOCAL_IMAGE" "$tag"
            docker image push "$tag"
          done <<< "$IMAGE_TAGS"

      - name: Create container release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MATRIX_IMAGE: ${{ matrix.image }}
          JSON_REPORT: ${{ steps.reports.outputs.json_report }}
          HTML_REPORT: ${{ steps.reports.outputs.html_report }}
          CSV_REPORT: ${{ steps.reports.outputs.csv_report }}
        shell: bash
        run: |
          set -euo pipefail

          tag="${MATRIX_IMAGE}-${RELEASE_VERSION}"
          title="${MATRIX_IMAGE} ${RELEASE_VERSION}"
          image_ref="${REGISTRY}/${IMAGE_NAME}:${RELEASE_VERSION}"
          notes=$(cat <<EOF
          Published container image for ${MATRIX_IMAGE}.

          ## Image Reference
          \`\`\`
          ${image_ref}
          \`\`\`

          ## Security Reports
          This release includes:
          - **Trivy** vulnerability scan (SARIF format)
          - **DockSec** analysis (JSON, HTML, CSV)
          - **SBOM** (Software Bill of Materials) in SPDX and CycloneDX formats
          - **CodeQL** integration for GitHub Security tab

          Review the attached reports to verify security compliance before deployment.

          ## Deployment Options

          ### Option 1: Deploy from Registry (Recommended)
          \`\`\`bash
          docker pull ${image_ref}
          docker run -d ${image_ref}
          \`\`\`

          ### Option 2: Build Locally
          \`\`\`bash
          git clone https://github.com/${GITHUB_REPOSITORY}.git
          cd ${MATRIX_IMAGE}
          docker build -t ${MATRIX_IMAGE}:${RELEASE_VERSION} .
          \`\`\`

          ## Verification
          All images are scanned with:
          - Trivy (vulnerability & configuration)
          - DockSec (comprehensive security analysis)
          - Gitleaks (secret detection)

          Reports attached to this release.
          EOF
          )

          assets=("trivy-results-${MATRIX_IMAGE}.sarif#trivy-vulnerability-scan.sarif")
          assets+=("sbom-${MATRIX_IMAGE}-spdx.json#sbom-spdx.json")
          assets+=("sbom-${MATRIX_IMAGE}-cyclonedx.json#sbom-cyclonedx.json")
          assets+=("${JSON_REPORT}#docksec-report.json")
          if [[ -n "${HTML_REPORT}" ]]; then
            assets+=("${HTML_REPORT}#docksec-report.html")
          fi
          if [[ -n "${CSV_REPORT}" ]]; then
            assets+=("${CSV_REPORT}#docksec-report.csv")
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" --clobber "${assets[@]}"
            gh release edit "$tag" --title "$title" --notes "$notes"
          else
            gh release create "$tag" --title "$title" --notes "$notes" "${assets[@]}"
          fi
