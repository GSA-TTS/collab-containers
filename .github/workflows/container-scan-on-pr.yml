---
# yamllint disable rule:line-length rule:truthy
name: Container Scan

on:
  pull_request:
    paths:
      - "*/Dockerfile"
      - "*/init.sh"
      - ".github/workflows/publish-containers.yml"
      - ".github/workflows/container-scan-on-pr.yml"
      - "trivy.yaml"
      - ".gitleaks.toml"

permissions:
  contents: read
  security-events: write  # Required for SARIF upload

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: Discover Docker build contexts
        id: discover
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob
          matrix_json='{"include":[]}'
          for dockerfile in */Dockerfile; do
            context_dir="${dockerfile%/Dockerfile}"
            image_name="$(printf '%s' "$context_dir" | tr '[:upper:]' '[:lower:]')"
            matrix_json="$(jq -c --arg context "$context_dir" --arg dockerfile "$dockerfile" --arg image "$image_name" \
              '.include += [{context: $context, dockerfile: $dockerfile, image: $image}]' <<< "$matrix_json")"
          done

          echo "matrix=$matrix_json" >> "$GITHUB_OUTPUT"

  scan:
    needs: discover
    if: ${{ fromJson(needs.discover.outputs.matrix).include[0] != null }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          tags: local/${{ matrix.image }}:pr-${{ github.event.pull_request.number }}

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: local/${{ matrix.image }}:pr-${{ github.event.pull_request.number }}
          format: 'sarif'
          output: trivy-results-${{ matrix.image }}.sarif
          severity: 'HIGH,CRITICAL'
          scanners: 'vuln,config,secret'

      # Upload the full SARIF report before failing the required security gate.
      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results-${{ matrix.image }}.sarif
          category: trivy-pr-${{ matrix.image }}

      - name: Enforce Trivy vulnerability threshold
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: local/${{ matrix.image }}:pr-${{ github.event.pull_request.number }}
          format: 'table'
          severity: 'HIGH,CRITICAL'
          scanners: 'vuln,config,secret'
          exit-code: '1'

      - name: Run DockSec scan-only analysis
        env:
          DOCKSEC_RESULTS_DIR: ${{ runner.temp }}/docksec-results/${{ matrix.image }}
        uses: ./DockSec
        with:
          dockerfile: ${{ matrix.dockerfile }}
          image: local/${{ matrix.image }}:pr-${{ github.event.pull_request.number }}
          scan_only: "true"

      - name: Upload DockSec artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pr-${{ matrix.image }}-security-scan
          path: |
            ${{ runner.temp }}/docksec-results/${{ matrix.image }}
            trivy-results-${{ matrix.image }}.sarif
          retention-days: 30
